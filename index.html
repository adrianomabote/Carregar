
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A carregar...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #252525;
            border-top: 4px solid #168BFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .text {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="loader"></div>
        <p class="text">A carregar...</p>
    </div>

    <script>
        setTimeout(function() {
            window.location.replace("https://molabet.online");
        }, 3000);
    </script>

</body>
</html>
